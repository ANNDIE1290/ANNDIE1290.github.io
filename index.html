<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--
        Content-Security-Policy (CSP) - 最严格的权限控制：
        - default-src 'none'   : 默认拒绝所有资源加载
        - img-src              : 仅允许从 svgsilh.com 加载图片/SVG
        - style-src 'self' 'unsafe-inline' : 允许页面内联样式（必要）
        - 其余全部禁止：无脚本、无框架、无字体、无媒体等
    -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'none';
                   img-src https://svgsilh.com https://cdn.svgsilh.com;
                   style-src 'self' 'unsafe-inline';
                   script-src 'none';
                   object-src 'none';
                   frame-src 'none';
                   connect-src 'none';
                   media-src 'none';
                   font-src 'none';
                   worker-src 'none';
                   base-uri 'none';
                   form-action 'none';
                   manifest-src 'none';
                   upgrade-insecure-requests">

    <!--
        Permissions-Policy - 显式禁用浏览器敏感 API：
        摄像头、麦克风、地理位置、支付、USB、磁铁计、陀螺仪、加速度计等全部关闭
    -->
    <meta http-equiv="Permissions-Policy"
          content="camera=(), microphone=(), geolocation=(),
                   payment=(), usb=(), magnetometer=(),
                   gyroscope=(), accelerometer=(),
                   display-capture=(), screen-wake-lock=(),
                   fullscreen=(self), publickey-credentials-get=()">

    <title>SVG Silhouette Viewer</title>

    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f5f5f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                         "Helvetica Neue", Arial, sans-serif;
            color: #333;
        }

        .container {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            padding: 40px;
            text-align: center;
            max-width: 90vw;
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 500;
            margin-bottom: 24px;
            color: #555;
        }

        .svg-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 200px;
        }

        img {
            max-width: 400px;
            width: 100%;
            height: auto;
            display: block;
        }

        /* 图片加载失败时的样式提示 */
        img[src=""] + .fallback-msg,
        img:not([src]):not([src=""]) + .fallback-msg {
            display: block;
        }

        .info {
            margin-top: 24px;
            font-size: 0.8rem;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>SVG Silhouette Viewer</h1>
        <div class="svg-wrapper">
            <img src="https://svgsilh.com/svg/1295198.svg" alt="SVG Silhouette Image">
        </div>
        <div class="info">
            来源: svgsilh.com | CSP 已启用（仅允许图片加载，禁止脚本/框架/字体等）
        </div>
    </div>
</body>
</html>
