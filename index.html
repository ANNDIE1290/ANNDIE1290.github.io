<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>随机人名抽取器</title>
    <style>
        /* 页面整体样式 */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        /* 主容器样式 */
        .container {
            background-color: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 600px;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
        }

        /* 巨大的空白输入框区域 */
        .input-area {
            width: 100%;
            height: 300px; /* 高度设置得比较大 */
            padding: 15px;
            box-sizing: border-box;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            resize: vertical; /* 允许用户拖动改变大小 */
            margin-bottom: 20px;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-area:focus {
            border-color: #4a90e2;
        }

        .hint {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 10px;
            text-align: left;
            display: block;
        }

        /* 按钮样式 */
        .btn {
            background-color: #4a90e2;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
            box-shadow: 0 4px 6px rgba(74, 144, 226, 0.3);
        }

        .btn:hover {
            background-color: #357abd;
        }

        .btn:active {
            transform: scale(0.98);
        }

        /* 结果显示区域 */
        .result-box {
            margin-top: 30px;
            padding: 20px;
            min-height: 60px;
            border-top: 1px dashed #ccc;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #result {
            font-size: 2.5rem;
            font-weight: bold;
            color: #e74c3c;
            animation: popIn 0.3s ease-out;
        }

        /* 简单的动画效果 */
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎲 随机抽取名称</h1>
        
        <span class="hint">请在下方空白区域填写人名（每行一个名字）：</span>
        刘世骏
        沙洪磊
      
        <!-- 巨大的输入框 -->
        <textarea id="nameInput" class="input-area" placeholder="张三&#10;李四&#10;王五&#10;赵六..."></textarea>
        
        <button class="btn" onclick="drawName()">开始抽取</button>

        <div class="result-box">
            <div id="result">准备就绪</div>
        </div>
    </div>

    <script>
        function drawName() {
            // 1. 获取输入框的内容
            const input = document.getElementById('nameInput').value;
            
            // 2. 按换行符分割成数组，并去除首尾空格
            // filter(item => item.trim() !== '') 用于过滤掉空行
            const names = input.split('\n').filter(item => item.trim() !== '');

            const resultDiv = document.getElementById('result');

            // 3. 检查是否有名字
            if (names.length === 0) {
                alert("输入框是空的，请先填写人名！");
                resultDiv.innerText = "未检测到名单";
                resultDiv.style.color = "#999";
                return;
            }

            // 4. 生成随机数
            const randomIndex = Math.floor(Math.random() * names.length);
            const winner = names[randomIndex];

            // 5. 显示结果
            resultDiv.style.color = "#e74c3c"; // 重置颜色
            // 强制重绘动画（为了让每次点击都有动画效果）
            resultDiv.style.animation = 'none';
            resultDiv.offsetHeight; /* trigger reflow */
            resultDiv.style.animation = 'popIn 0.3s ease-out';
            
            resultDiv.innerText = "🎉 " + winner + " 🎉";
        }
    </script>
</body>
</html>
